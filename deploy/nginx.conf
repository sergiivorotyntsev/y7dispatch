# Y7 Dispatch — Nginx reverse proxy config
#
# Architecture: Internet → Nginx (SSL/443) → Uvicorn (8000, localhost only)
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/y7dispatch
#          sudo ln -s /etc/nginx/sites-available/y7dispatch /etc/nginx/sites-enabled/
#          sudo certbot --nginx -d y7dispatch.yourdomain.com
#          sudo nginx -t && sudo systemctl reload nginx

# Rate limit zones (defined in http block — add to /etc/nginx/nginx.conf)
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=login:10m rate=3r/m;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name y7dispatch.yourdomain.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name y7dispatch.yourdomain.com;

    # SSL certs from Let's Encrypt (certbot)
    ssl_certificate /etc/letsencrypt/live/y7dispatch.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/y7dispatch.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (for PDF uploads)
    client_max_body_size 50M;

    # Login — strict rate limit (3 per minute per IP)
    location = /api/auth/login {
        # limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check — no rate limit
    location /api/health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # API proxy — general rate limit
    location /api/ {
        # limit_req zone=api burst=50 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running operations (extraction, export)
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Frontend static files (built React app)
    location / {
        root /app/web/dist;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
